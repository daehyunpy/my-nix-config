# Keep provider credentials in the user's OMP profile.
tools:
  approvalMode: yolo

lsp:
  enabled: true
  diagnosticsOnWrite: true
  diagnosticsOnEdit: true
  formatOnWrite: false

modelRoles:
  # General model tiers.
  default: openai-codex/gpt-6.1-sol:high
  smol: openai-codex/gpt-6.1-terra:high
  slow: "@default:xhigh"

  # Coding workflows.
  task: "@default"
  plan: "@slow"
  commit: "@smol"
  advisor: openai-codex/gpt-6-astra:high

  # Background work.
  tiny: openai-codex/gpt-6-luna:low
  memory: "@default"
  widget: "@tiny"

  # Analysis and search.
  vision: "@default"
  judge: "@tiny"
  web: openai-codex/gpt-6-luna

  # Image and audio.
  image: openai-codex/gpt-image-2
  speech:
  dictation:

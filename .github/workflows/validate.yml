name: Validate configuration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  terraform:
    name: Tailscale Terraform validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version_file: infra/tailscale/.opentofu-version
          tofu_wrapper: false
      - name: Check Terraform formatting
        run: tofu -chdir=infra/tailscale fmt -check
      - name: Initialize locked provider without a backend
        run: tofu -chdir=infra/tailscale init -backend=false -input=false -lockfile=readonly
      - name: Validate Terraform configuration
        run: tofu -chdir=infra/tailscale validate

  linux:
    name: Formatting and Linux evaluation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31.11.2
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check validation error handling
        run: bash scripts/check-test.sh
      - name: Check formatting
        run: bash scripts/check.sh format
      - name: Evaluate Linux configuration
        run: bash scripts/check.sh linux

  darwin:
    name: Darwin evaluations
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31.11.2
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Evaluate Darwin configurations
        run: bash scripts/check.sh darwin

name: Validate Nix

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  linux:
    name: Formatting and Linux evaluation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31.11.2
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check validation error handling
        run: bash tests/check.sh
      - name: Check formatting
        run: bash scripts/check.sh format
      - name: Evaluate Linux configuration
        run: bash scripts/check.sh linux

  darwin:
    name: Darwin evaluations
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31.11.2
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Evaluate Darwin configurations
        run: bash scripts/check.sh darwin
